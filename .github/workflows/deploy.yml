name: deploy

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: true
      PYPI_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install Poetry
        run: python -m pip install poetry==2.4.3

      - name: Restore Development Environment
        run: poetry install --no-interaction

      - name: Release
        run: poetry run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}