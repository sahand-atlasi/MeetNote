name: deploy

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: true
      PYPI_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    concurrency:
      group: deploy
    runs-on: ubuntu-latest

    steps:
      # existing steps...
steps:
  - name: Checkout Code
    uses: actions/checkout@v6
    with:
      fetch-depth: 0

  - name: Set up Python
    uses: actions/setup-python@v7
    with:
      python-version: "3.12"
      cache: poetry

  - name: Install Poetry
    run: pipx install poetry==2.4.3

  - name: Restore Development Environment
    run: poetry install --no-interaction

  - name: Release
    shell: bash
    run: poetry run semantic-release
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
